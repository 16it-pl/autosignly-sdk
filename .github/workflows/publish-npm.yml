name: publish-npm

on:
  push:
    tags:
      # node/v* publishes the client, cli/v* publishes the command line tool
      - "node/v*"
      - "cli/v*"
  workflow_dispatch:
    inputs:
      package:
        description: Which package to publish
        required: true
        type: choice
        options:
          - client
          - cli
      tag:
        description: npm dist-tag (use dev for prereleases, latest for stable)
        required: true
        default: dev
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Trusted publishing: npm mints a short-lived credential from this token,
      # so no NPM_TOKEN has to live in the repository.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm 11.5.1+, which ships with Node 24.
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Pick the package
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            case "${{ github.ref_name }}" in
              node/v*) echo "dir=clients/node" >> "$GITHUB_OUTPUT" ;;
              cli/v*)  echo "dir=tools/cli"    >> "$GITHUB_OUTPUT" ;;
            esac
            # A prerelease version must not take over the latest tag.
            case "${{ github.ref_name }}" in
              *-*) echo "tag=dev"    >> "$GITHUB_OUTPUT" ;;
              *)   echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
            esac
          else
            [ "${{ inputs.package }}" = "client" ] \
              && echo "dir=clients/node" >> "$GITHUB_OUTPUT" \
              || echo "dir=tools/cli" >> "$GITHUB_OUTPUT"
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        working-directory: ${{ steps.pick.outputs.dir }}
        run: npm ci

      - name: Run the test suite
        working-directory: ${{ steps.pick.outputs.dir }}
        run: npm test

      - name: Build
        working-directory: ${{ steps.pick.outputs.dir }}
        run: npm run build

      - name: Confirm the tag matches package.json
        if: github.event_name == 'push'
        working-directory: ${{ steps.pick.outputs.dir }}
        run: |
          version=$(node -p "require('./package.json').version")
          tagged="${GITHUB_REF_NAME#*/v}"
          if [ "$version" != "$tagged" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi

      - name: Publish
        working-directory: ${{ steps.pick.outputs.dir }}
        run: npm publish --tag ${{ steps.pick.outputs.tag }} --provenance
