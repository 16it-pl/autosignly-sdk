components:
  schemas:
    ApiKeyValidationResponseV1:
      properties:
        valid:
          description: Whether the provided API key and secret are a valid, recognized credential pair
          examples:
          - true
          type: boolean
      type: object
    AttachmentFormat:
      description: Detected original format of the attachment. Detection is based on the file content (magic bytes), never
        on the file name or the client-supplied content type.
      enum:
      - PDF
      - JPEG
      - PNG
      - HEIC
      type: string
    AttachmentResponse:
      description: A file attached to a document. Attachments are converted to PDF and merged into the document when it is
        sent for signing, behind an index page listing each one with its checksum — so a single signature covers the document
        and everything attached to it.
      properties:
        fileName:
          description: File name as uploaded, stripped of any path.
          examples:
          - protocol-photo-1.jpg
          type: string
        fileUrl:
          description: Short-lived link to the attachment converted to PDF — the rendition that gets merged. Null while the
            conversion is not ready.
          type: string
        format:
          $ref: '#/components/schemas/AttachmentFormat'
          description: Format detected from the file content, never from its name or content type.
          type: string
        id:
          description: Unique attachment identifier.
          examples:
          - 9f1c2d3e-4b5a-6789-abcd-ef0123456789
          type: string
        orderIndex:
          description: Position in the merged document, 0-based. Attachments merge in this order.
          examples:
          - 0
          format: int32
          type: integer
        pageCount:
          description: Number of pages this attachment takes in the merged document. Null until the conversion finishes.
          examples:
          - 2
          format: int32
          type: integer
        sha256:
          description: SHA-256 of the uploaded file, printed on the index page of the signed document so a reader can verify
            the attachment independently.
          examples:
          - 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
          type: string
        sizeBytes:
          description: Size of the uploaded file in bytes, before conversion to PDF.
          examples:
          - 482913
          format: int64
          type: integer
        status:
          $ref: '#/components/schemas/DocumentAttachmentStatus'
          description: READY means the attachment is converted and will be merged; FAILED means the conversion did not succeed
            and the attachment is skipped when the document is signed.
          type: string
      type: object
    CredentialsResponse:
      description: Who the caller is and which environment the key belongs to.
      properties:
        companyId:
          description: Company the key belongs to. Null when the pair is invalid.
          type: string
        environmentId:
          description: Environment the key operates on. Null when the pair is invalid.
          type: string
        environmentType:
          $ref: '#/components/schemas/EnvironmentType'
          description: Whether the key operates on production or on a sandbox. Null when the pair is invalid.
          type: string
        valid:
          description: Whether the key and secret are a valid pair.
          examples:
          - true
          type: boolean
      type: object
    DocumentAttachmentStatus:
      description: Attachment processing status. READY = converted to PDF and ready to be merged into the signed document;
        FAILED = conversion failed, the attachment is skipped when the document is sent to sign.
      enum:
      - READY
      - FAILED
      type: string
    DocumentInfoResponse:
      description: Full details of a single document, including its current status, signing mode, and the list of assigned
        signers.
      properties:
        companyId:
          description: ID of the company that owns this document.
          examples:
          - 7f3c1a2b-beef-4d5e-a6f7-123456789abc
          type: string
        fileUrl:
          description: Short-lived link to the document file. Null when the document has no file yet. The link expires, so
            fetch the document again to obtain a fresh one rather than storing it. A document that is still being signed can
            be downloaded as well - it then carries only the signatures collected so far.
          examples:
          - https://files.autosignly.eu/...
          type: string
        id:
          description: Unique document identifier.
          examples:
          - 03bef6df-faca-4aee-9836-80caeeaf4418
          type: string
        name:
          description: Human-readable document name.
          examples:
          - Umowa o pracę 2024
          type: string
        signerResponses:
          description: All signers assigned to this document, in signing order.
          items:
            $ref: '#/components/schemas/SignerResponse'
          type: array
        signingMode:
          $ref: '#/components/schemas/DocumentSigningMode'
          description: 'Signing mode: whether the document requires a signature, is already signed, or requires none.'
          type: string
        status:
          $ref: '#/components/schemas/DocumentStatus'
          description: Current lifecycle status of the document.
          type: string
        tags:
          description: Tags assigned to the document.
          items:
            $ref: '#/components/schemas/TagResponse1'
          type: array
      type: object
    DocumentListItemResponse:
      description: Summary of a single document as returned in a paged list. Does not include signer details.
      properties:
        createdAt:
          $ref: '#/components/schemas/Instant'
          description: Timestamp when the document was created.
          examples:
          - 2024-03-15 10:30:00+00:00
          type: string
        id:
          description: Unique document identifier.
          examples:
          - 03bef6df-faca-4aee-9836-80caeeaf4418
          type: string
        name:
          description: Human-readable document name.
          examples:
          - Umowa o pracę 2024
          type: string
        signingMode:
          $ref: '#/components/schemas/DocumentSigningMode'
          description: 'Signing mode: whether the document requires a signature, is already signed, or requires none.'
          type: string
        status:
          $ref: '#/components/schemas/DocumentStatus'
          description: Current lifecycle status of the document.
          type: string
        tags:
          description: Tags assigned to the document.
          items:
            $ref: '#/components/schemas/TagResponse1'
          type: array
      type: object
    DocumentSigningMode:
      enum:
      - REQUIRES_SIGNATURE
      - ALREADY_SIGNED
      - NO_SIGNATURE_REQUIRED
      type: string
    DocumentStatus:
      description: Document status. GENERATED = created, signers not yet assigned; SIGNERS_ASSIGNED = signers assigned, not
        yet sent; AWAITING_INITIAL_USB_SIGN = initial USB seal in progress, emails not yet sent; NEED_RETRY_USB_INITIAL =
        initial seal failed fast retries, hourly auto-retry active up to 12h; USB_SIGN_INITIAL_FAILED = initial seal exhausted
        all retries, awaiting manual retry; WAITING_FOR_SIGNATURE = invitations sent; SIGNING_IN_PROGRESS = at least one signer
        signed; AWAITING_FINAL_USB_SIGN = final USB seal in progress; NEED_RETRY_USB_FINALIZE = final seal failed fast retries,
        hourly auto-retry active up to 12h; USB_SIGN_FINAL_FAILED = final seal exhausted all retries, awaiting manual retry;
        SIGNED = all signatures collected; CANCELLED = signing cancelled after at least one signature or link expiry; CANCELLED_REMOVABLE
        = cancelled before any signature collected, restorable to GENERATED.
      enum:
      - GENERATED
      - SIGNERS_ASSIGNED
      - AWAITING_INITIAL_USB_SIGN
      - NEED_RETRY_USB_INITIAL
      - USB_SIGN_INITIAL_FAILED
      - WAITING_FOR_SIGNATURE
      - SIGNING_IN_PROGRESS
      - AWAITING_FINAL_USB_SIGN
      - NEED_RETRY_USB_FINALIZE
      - USB_SIGN_FINAL_FAILED
      - SIGNED
      - CANCELLED
      - CANCELLED_REMOVABLE
      type: string
    EnvironmentType:
      description: 'Environment type: PROD for the production environment, SANDBOX for isolated test environments.'
      enum:
      - PROD
      - SANDBOX
      type: string
    ExternalSignerRequest:
      description: A single signer to be assigned to the document.
      properties:
        country:
          description: Signer's signing country as ISO 3166-1 alpha-2 code. Required. Determines the applicable signature
            policy.
          examples:
          - PL
          pattern: ^[A-Za-z]{2}$
          type: string
        email:
          description: Signer's email address. Required. The signing link is delivered here.
          examples:
          - jan.kowalski@example.com
          pattern: \S
          type: string
        firstName:
          description: Signer's first name. Required.
          examples:
          - Jan
          pattern: \S
          type: string
        lastName:
          description: Signer's last name. Required.
          examples:
          - Kowalski
          pattern: \S
          type: string
        locale:
          description: Language tag for the signing UI shown to this signer (IETF BCP 47). Optional, defaults to the document
            locale.
          examples:
          - pl
          type: string
        order:
          description: Signing order. Signers are notified in ascending order — the next signer receives their link only after
            the previous one has signed. Optional; if omitted, treated as 0 (no ordering guarantee among signers without an
            explicit order).
          examples:
          - 1
          format: int32
          minimum: 1
          type: integer
        phoneNumber:
          description: Signer's phone number in E.164 format. Required for AES+SMS verification.
          examples:
          - '+48123456789'
          type: string
        signatureType:
          $ref: '#/components/schemas/SignatureType'
          description: Override the document-level signature type for this signer only. Optional — when omitted, the signer
            inherits the request-level signatureType (or SES when that is also not set).
          examples:
          - QES
          type: string
        signatureVerificationMethod:
          $ref: '#/components/schemas/VerificationMethod'
          description: Verification method for AES signatures (SMS or WK). Required when signatureType is AES, ignored otherwise.
          type: string
      required:
      - firstName
      - lastName
      - email
      - country
      type: object
    Instant:
      examples:
      - 2022-03-10 16:15:50+00:00
      format: date-time
      type: string
    Locale:
      properties:
        country:
          type: string
        displayCountry:
          type: string
        displayLanguage:
          type: string
        displayName:
          type: string
        displayScript:
          type: string
        displayVariant:
          type: string
        extensionKeys:
          items:
            format: char
            type: string
          type: array
          uniqueItems: true
        iSO3Country:
          type: string
        iSO3Language:
          type: string
        language:
          type: string
        script:
          type: string
        unicodeLocaleAttributes:
          items:
            type: string
          type: array
          uniqueItems: true
        unicodeLocaleKeys:
          items:
            type: string
          type: array
          uniqueItems: true
        variant:
          type: string
      type: object
    PageInfo:
      properties:
        number:
          format: int32
          type: integer
        size:
          format: int32
          type: integer
        totalElements:
          format: int64
          type: integer
        totalPages:
          format: int32
          type: integer
      type: object
    PageResponseDocumentListItemResponseV1:
      properties:
        content:
          items:
            $ref: '#/components/schemas/DocumentListItemResponse'
          type: array
        page:
          $ref: '#/components/schemas/PageInfo'
      type: object
    PageResponseTagResponseV1:
      properties:
        content:
          items:
            $ref: '#/components/schemas/TagResponse1'
          type: array
        page:
          $ref: '#/components/schemas/PageInfo'
      type: object
    SendForSigningRequest:
      description: 'Request body for POST /publics/v1/documents/{documentId}/signings.


        The document must be in GENERATED or SIGNERS_ASSIGNED status — any other status returns 400.


        Status `GENERATED`: `signers` is required and must not be empty; provided signers are saved and the document is sent.


        Status `SIGNERS_ASSIGNED`: `signers` must be omitted or empty — signers already assigned to the document are used.
        Providing any signers returns 400.

        '
      properties:
        signatureMode:
          $ref: '#/components/schemas/SignatureMode'
          description: 'Where signatures are placed: STAMP (visual stamp on the document) or SIGNATURES_CARD (a dedicated
            card appended to the document). Defaults to STAMP.'
          examples:
          - SIGNATURES_CARD
          type: string
        signatureType:
          $ref: '#/components/schemas/SignatureType'
          description: 'Type of signature: QES (qualified), AES (advanced), or SES (simple). Required.'
          examples:
          - SES
          type: string
        signers:
          description: 'List of signers. Conditional on document status:

            - Status GENERATED: required, must not be empty. Signers are created and the first (by `order`) receives the signing
            link immediately.

            - Status SIGNERS_ASSIGNED: must be omitted or empty. Providing signers returns 400 because signers are already
            set in the document.

            '
          items:
            $ref: '#/components/schemas/ExternalSignerRequest'
          type: array
        signingInitiatorData:
          $ref: '#/components/schemas/SigningInitiatorData'
          description: Optional data identifying the person initiating the signing flow (email and locale). Used to personalise
            notifications sent to the initiator.
          examples:
          - email: initiator@example.com
            locale: pl
          type: object
        verificationMethod:
          $ref: '#/components/schemas/VerificationMethod'
          description: Verification method for AES signatures (SMS or WK). Required when `signatureType` is AES.
          type: string
      required:
      - signatureType
      type: object
    SendForSigningResponse:
      description: Result of sending a document for signing. Contains the document-level status and the list of all signers.
      properties:
        documentId:
          description: ID of the document that was sent for signing.
          examples:
          - 03bef6df-faca-4aee-9836-80caeeaf4418
          type: string
        signers:
          description: All signers assigned to this document. The first signer (AWAITING_SIGNATURE) receives the signing link
            immediately; the rest are PENDING.
          items:
            $ref: '#/components/schemas/SignerStatusResponse'
          type: array
        status:
          $ref: '#/components/schemas/SigningStatusV1'
          description: Document-level signing status. Always SENT after a successful call.
          type: string
      type: object
    SetDocumentTagsRequest:
      description: 'Replaces the whole tag set of the document: tags left out are removed from it, tags listed here are added.
        An empty request clears all tags.'
      properties:
        names:
          description: Tag names — existing ones are reused, missing ones are added to the company tag list.
          items:
            maxLength: 15
            type: string
          type: array
        tagIds:
          description: Ids of tags that already exist in the company tag list.
          items:
            type: string
          type: array
      type: object
    SignatureMode:
      description: 'Signature mode: STAMP (signer places a visual stamp on the document) or SIGNATURES_CARD (signatures collected
        on a dedicated card appended to the document).'
      enum:
      - STAMP
      - SIGNATURES_CARD
      type: string
    SignatureType:
      description: 'Signature type: QES (qualified), AES (advanced), SES (simple)'
      enum:
      - QES
      - AES
      - SES
      type: string
    SignerResponse:
      description: Details of a signer assigned to a document, including contact data, signature type, and their position
        in the signing order.
      properties:
        country:
          description: ISO 3166-1 alpha-2 country code used to resolve country-specific signing policy.
          examples:
          - PL
          type: string
        email:
          description: Signer's email address — used to deliver the signing link.
          examples:
          - jan.kowalski@example.com
          type: string
        firstName:
          description: Signer's first name.
          examples:
          - Jan
          type: string
        lastName:
          description: Signer's last name.
          examples:
          - Kowalski
          type: string
        locale:
          $ref: '#/components/schemas/Locale'
          description: Locale used to localise signing emails and UI for this signer.
          examples:
          - pl
          type: object
        phoneNumber:
          description: Signer's phone number in E.164 format, required for SMS verification.
          examples:
          - '+48600100200'
          type: string
        signatureType:
          $ref: '#/components/schemas/SignatureType'
          description: Signature type required from this signer.
          type: string
        signatureVerificationMethod:
          $ref: '#/components/schemas/VerificationMethod'
          description: Verification method used to confirm the signer's identity before an AES signature. Null for SES.
          type: string
        signingOrder:
          description: Position of this signer in the sequential signing order. The signer with order 1 signs first.
          examples:
          - 1
          format: int32
          type: integer
      type: object
    SignerStatusResponse:
      description: Status and signing link for a single signer. Only the first signer in signing order has signUrl and expiresAt
        populated; the remaining signers receive their link by email when their turn comes.
      properties:
        email:
          description: Signer's email address.
          examples:
          - jan.kowalski@example.com
          type: string
        expiresAt:
          $ref: '#/components/schemas/Instant'
          description: Expiry timestamp of the signing link. Present only when signUrl is not null. The link is valid for
            48 hours from the moment the document was sent.
          examples:
          - 2026-05-11 10:00:00+00:00
          type: string
        signUrl:
          description: Direct signing link for this signer. Present only for the first signer (AWAITING_SIGNATURE); null for
            all others (PENDING). Link is valid until expiresAt.
          examples:
          - https://sign.example.com/s/abc123?hmac=xyz&expires=1234567890
          type: string
        status:
          $ref: '#/components/schemas/SigningStatusV1'
          description: Per-signer signing status. AWAITING_SIGNATURE — this signer is currently active and received the signing
            link. PENDING — this signer is waiting for the preceding signers to finish.
          type: string
      type: object
    SigningInitiatorData:
      properties:
        email:
          type: string
        locale:
          $ref: '#/components/schemas/Locale'
      type: object
    SigningStatusV1:
      description: Signing status — used both at the document level and per signer.
      enum:
      - SENT
      - AWAITING_SIGNATURE
      - PENDING
      type: string
    TagRequest:
      description: Tag to add to the company tag list.
      properties:
        name:
          description: Tag name, max 15 characters. An existing tag with the same name (case-insensitive) is reused.
          examples:
          - Umowy
          maxLength: 15
          pattern: \S
          type: string
      required:
      - name
      type: object
    TagResponse1:
      description: Company tag. Tags group documents and templates; a document generated from a template inherits its tags.
      properties:
        color:
          description: Pastel colour derived from the name, for rendering chips.
          examples:
          - '#F6D6D8'
          type: string
        id:
          description: Unique tag identifier.
          examples:
          - 8f14e45f-ceea-467a-9575-1c1e0f9a3b21
          type: string
        name:
          description: Tag name, max 15 characters.
          examples:
          - Umowy
          type: string
      type: object
    UploadPdfAndSignRequest:
      description: Request body (multipart `request` part) for POST /publics/v1/documents/signings. Uploads a PDF and immediately
        sends it for signing.
      properties:
        documentName:
          description: Display name of the document.
          examples:
          - Umowa najmu 2025
          pattern: \S
          type: string
        signatureMode:
          $ref: '#/components/schemas/SignatureMode'
          description: 'Where signatures are placed: STAMP (visual stamp on the document) or SIGNATURES_CARD (a dedicated
            card appended to the document). Defaults to STAMP.'
          examples:
          - SIGNATURES_CARD
          type: string
        signatureType:
          $ref: '#/components/schemas/SignatureType'
          description: 'Type of signature: QES (qualified), AES (advanced), or SES (simple). Defaults to SES.'
          examples:
          - SES
          type: string
        signers:
          description: List of signers. Must contain at least one entry.
          items:
            $ref: '#/components/schemas/ExternalSignerRequest'
          minItems: 1
          type: array
        signingInitiatorData:
          $ref: '#/components/schemas/SigningInitiatorData'
          description: Optional data identifying the person initiating the signing flow (email and locale).
          examples:
          - email: initiator@example.com
            locale: pl
          type: object
        verificationMethod:
          $ref: '#/components/schemas/VerificationMethod'
          description: Verification method for AES signatures (SMS or WK). Required when signatureType is AES.
          type: string
      required:
      - documentName
      - signers
      type: object
    UploadPdfAndSignResponse:
      description: Result of uploading a PDF and sending it for signing. Signing links are delivered by the system directly
        to each signer by email.
      properties:
        documentId:
          description: ID of the created document.
          examples:
          - 03bef6df-faca-4aee-9836-80caeeaf4418
          type: string
      type: object
    UploadPdfRequest:
      description: What to call the uploaded document. Signers and signature settings are given later, when the document is
        sent for signing.
      properties:
        documentName:
          description: Name of the document, shown to signers and used for the stored file.
          examples:
          - Consulting agreement
          pattern: \S
          type: string
      required:
      - documentName
      type: object
    UploadPdfResponse:
      description: Result of uploading a PDF. The document is stored but not sent to anyone yet, so attachments can still
        be added to it.
      properties:
        documentId:
          description: ID of the created document.
          examples:
          - 03bef6df-faca-4aee-9836-80caeeaf4418
          type: string
      type: object
    VerificationMethod:
      description: Verification method used for AES signatures. SMS / WK are picked per-country policy. BIOMETRIC is never
        required by any policy — it is always accepted because the user already cleared WK and phone-number verification at
        mobile onboarding before a device key could be registered. SES signatures do not invoke verification at all.
      enum:
      - SMS
      - WK
      - BIOMETRIC
      - WEBAUTHN
      examples:
      - SMS
      type: string
  securitySchemes:
    SecurityScheme:
      bearerFormat: JWT
      description: Authentication
      scheme: bearer
      type: http
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  title: Autodocuments API
  version: v1
openapi: 3.1.0
paths:
  /api/publics/v1/api-key:
    get:
      description: 'Checks whether the provided API key + secret pair is valid and whether it belongs to the given company.


        Invalid credentials always return `200` with `valid=false` — the endpoint never returns `401` to avoid key enumeration.
        Only missing or blank headers produce `400`.

        '
      parameters:
      - description: API key to validate
        example: api_0XHLWp0eu5VRxdWJ_xcG-_zqUUZW640Xl07-KkOXhxw
        in: header
        name: X-API-KEY
        required: true
        schema:
          pattern: \S
          type: string
      - description: API secret paired with the key
        in: header
        name: X-API-SECRET
        required: true
        schema:
          pattern: \S
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyValidationResponseV1'
          description: Validation result
        '400':
          description: X-API-KEY, X-API-SECRET, or companyId header is missing or blank
      summary: Validate API credentials
      tags:
      - Public API – document signing
  /api/publics/v1/credentials:
    get:
      description: 'Reports whether the key and secret are valid and which environment they operate on. Use it to confirm
        a client is pointed at a sandbox rather than at production.


        Invalid credentials return `200` with `valid=false` - this endpoint never answers with `401`, so keys cannot be probed.
        Only a missing or blank header produces `400`.

        '
      parameters:
      - description: API key identifying the calling company
        in: header
        name: X-API-KEY
        required: true
        schema:
          pattern: \S
          type: string
      - description: API secret for the calling company
        in: header
        name: X-API-SECRET
        required: true
        schema:
          pattern: \S
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialsResponse'
          description: Result of the lookup
        '400':
          description: X-API-KEY or X-API-SECRET header is missing or blank
      summary: Describe the calling credentials
      tags:
      - Public API – document signing
  /api/publics/v1/documents:
    get:
      description: 'Returns a paged list of documents belonging to the company identified by the API key. Optionally filter
        by one or more statuses. Sort via the `sort` query param, e.g. `sort=creationTimestamp,desc`.

        '
      parameters:
      - in: query
        name: page
        schema:
          default: '0'
          format: int32
          type: integer
      - in: query
        name: size
        schema:
          default: '20'
          format: int32
          type: integer
      - in: query
        name: sort
        schema:
          items:
            type: string
          type: array
      - description: Filter by status. Repeat for multiple values, e.g. status=SIGNED&status=GENERATED
        in: query
        name: status
        schema:
          items:
            $ref: '#/components/schemas/DocumentStatus'
          type: array
      - description: API key identifying the calling company
        example: api_0XHLWp0eu5VRxdWJ_xcG-_zqUUZW640Xl07-KkOXhxw
        in: header
        name: X-API-KEY
        required: true
        schema:
          pattern: \S
          type: string
      - description: API secret for the calling company
        in: header
        name: X-API-SECRET
        required: true
        schema:
          pattern: \S
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseDocumentListItemResponseV1'
          description: Document list returned successfully
        '400':
          description: X-API-KEY or X-API-SECRET header is missing or blank
        '401':
          description: Invalid API key or secret
      summary: List documents
      tags:
      - Public API – document signing
    post:
      description: 'Stores a PDF as a document without notifying anyone. Use this when the document needs attachments before
        it goes out: upload it, attach the files, then send it with `/documents/{documentId}/signings`.


        To upload and send in a single call, use `/documents/signings` instead — a document that has already been sent can
        no longer take attachments.

        '
      parameters:
      - description: API key identifying the calling company
        in: header
        name: X-API-KEY
        required: true
        schema:
          pattern: \S
          type: string
      - description: API secret for the calling company
        in: header
        name: X-API-SECRET
        required: true
        schema:
          pattern: \S
          type: string
      requestBody:
        content:
          multipart/form-data:
            encoding:
              request:
                contentType: application/json
            schema:
              properties:
                file:
                  description: PDF file to store
                  format: binary
                  type: string
                request:
                  $ref: '#/components/schemas/UploadPdfRequest'
                  description: Name of the document
                  properties:
                    documentName:
                      description: Name of the document, shown to signers and used for the stored file.
                      examples:
                      - Consulting agreement
                      pattern: \S
                      type: string
                  required:
                  - documentName
                  type: object
              required:
              - file
              - request
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadPdfResponse'
          description: Document stored, ready for attachments and signers
        '400':
          description: 'Invalid request. Possible reasons:

            - Missing or invalid file

            - File failed antivirus scan

            - Blank documentName

            '
        '401':
          description: Invalid or missing X-API-KEY / X-API-SECRET headers
      summary: Upload a PDF without sending it
      tags:
      - Public API – document signing
  /api/publics/v1/documents/signings:
    post:
      description: 'Uploads a PDF file and immediately sends it to the provided signers.

        Signing links are delivered by the system directly to each signer by email. Only the `documentId` is returned so the
        caller can track the document status later.

        '
      parameters:
      - description: API key identifying the calling company
        in: header
        name: X-API-KEY
        required: true
        schema:
          pattern: \S
          type: string
      - description: API secret for the calling company
        in: header
        name: X-API-SECRET
        required: true
        schema:
          pattern: \S
          type: string
      requestBody:
        content:
          multipart/form-data:
            encoding:
              request:
                contentType: application/json
            schema:
              properties:
                file:
                  description: PDF file to send for signing
                  format: binary
                  type: string
                request:
                  $ref: '#/components/schemas/UploadPdfAndSignRequest'
                  description: Signing configuration (document name, signers, signature type)
                  properties:
                    documentName:
                      description: Display name of the document.
                      examples:
                      - Umowa najmu 2025
                      pattern: \S
                      type: string
                    signatureMode:
                      $ref: '#/components/schemas/SignatureMode'
                      description: 'Where signatures are placed: STAMP (visual stamp on the document) or SIGNATURES_CARD (a
                        dedicated card appended to the document). Defaults to STAMP.'
                      examples:
                      - SIGNATURES_CARD
                      type: string
                    signatureType:
                      $ref: '#/components/schemas/SignatureType'
                      description: 'Type of signature: QES (qualified), AES (advanced), or SES (simple). Defaults to SES.'
                      examples:
                      - SES
                      type: string
                    signers:
                      description: List of signers. Must contain at least one entry.
                      items:
                        $ref: '#/components/schemas/ExternalSignerRequest'
                      minItems: 1
                      type: array
                    signingInitiatorData:
                      $ref: '#/components/schemas/SigningInitiatorData'
                      description: Optional data identifying the person initiating the signing flow (email and locale).
                      examples:
                      - email: initiator@example.com
                        locale: pl
                      type: object
                    verificationMethod:
                      $ref: '#/components/schemas/VerificationMethod'
                      description: Verification method for AES signatures (SMS or WK). Required when signatureType is AES.
                      type: string
                  required:
                  - documentName
                  - signers
                  type: object
              required:
              - file
              - request
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadPdfAndSignResponse'
          description: Document uploaded and sent for signing
        '400':
          description: 'Invalid request. Possible reasons:

            - Missing or invalid file

            - File failed antivirus scan

            - Blank documentName

            - Empty signers list

            - signatureType AES without verificationMethod on the request

            - AES signer missing signatureVerificationMethod

            - Bean-validation failure on signer fields

            '
        '401':
          description: Invalid or missing X-API-KEY / X-API-SECRET headers
      summary: Upload PDF and send for signing
      tags:
      - Public API – document signing
  /api/publics/v1/documents/{documentId}:
    get:
      description: 'Returns basic information about the document, its status, and the list of signers. Access is restricted
        to documents belonging to the company identified by the API key.


        The response carries `fileUrl`, a short-lived link to the document file. The link expires, so fetch the document again
        to obtain a fresh one rather than storing it. A document that is still being signed can be downloaded as well - it
        then carries only the signatures collected so far.

        '
      parameters:
      - description: ID of the document
        example: 03bef6df-faca-4aee-9836-80caeeaf4418
        in: path
        name: documentId
        required: true
        schema:
          type: string
      - description: API key identifying the calling company
        example: api_0XHLWp0eu5VRxdWJ_xcG-_zqUUZW640Xl07-KkOXhxw
        in: header
        name: X-API-KEY
        required: true
        schema:
          pattern: \S
          type: string
      - description: API secret for the calling company
        in: header
        name: X-API-SECRET
        required: true
        schema:
          pattern: \S
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentInfoResponse'
          description: Document info returned successfully
        '400':
          description: X-API-KEY or X-API-SECRET header is missing or blank
        '401':
          description: Invalid API key or secret
        '403':
          description: Document does not belong to the company associated with the provided API key
      summary: Get document info
      tags:
      - Public API – document signing
  /api/publics/v1/documents/{documentId}/attachments:
    get:
      description: 'Attachments of a document, in the order they will be merged. Each carries the SHA-256 of the uploaded
        file — the same checksum printed on the index page of the signed document, so a reader can verify an attachment independently.

        '
      parameters:
      - description: Document to list the attachments of
        in: path
        name: documentId
        required: true
        schema:
          type: string
      - description: API key identifying the calling company
        in: header
        name: X-API-KEY
        required: true
        schema:
          pattern: \S
          type: string
      - description: API secret for the calling company
        in: header
        name: X-API-SECRET
        required: true
        schema:
          pattern: \S
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AttachmentResponse'
                type: array
          description: Attachments of the document
        '401':
          description: Invalid or missing X-API-KEY / X-API-SECRET headers
        '404':
          description: No such document in this company and environment
      summary: List document attachments
      tags:
      - Public API – document signing
    post:
      description: 'Adds a file to a document that has not been sent for signing yet. The attachment is converted to PDF and
        merged into the document when it is sent, behind an index page listing every attachment with its checksum — so one
        signature covers the document and everything attached to it.


        Accepted formats are PDF, JPEG and PNG, detected from the file content rather than from its name. Attachments merge
        in upload order.

        '
      parameters:
      - description: Document to attach the file to
        in: path
        name: documentId
        required: true
        schema:
          type: string
      - description: API key identifying the calling company
        in: header
        name: X-API-KEY
        required: true
        schema:
          pattern: \S
          type: string
      - description: API secret for the calling company
        in: header
        name: X-API-SECRET
        required: true
        schema:
          pattern: \S
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                file:
                  description: File to attach
                  format: binary
                  type: string
              required:
              - file
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentResponse'
          description: Attachment stored and converted
        '400':
          description: 'Invalid request. Possible reasons:

            - Unsupported format, or a password protected PDF

            - Empty file

            - File, count or total size limit exceeded

            - Document is no longer editable, because it has already been sent for signing

            '
        '401':
          description: Invalid or missing X-API-KEY / X-API-SECRET headers
        '404':
          description: No such document in this company and environment
      summary: Attach a file to a document
      tags:
      - Public API – document signing
  /api/publics/v1/documents/{documentId}/attachments/{attachmentId}:
    delete:
      description: Removes an attachment from a document that has not been sent for signing yet. The remaining attachments
        close the gap in the merge order.
      parameters:
      - description: Attachment to remove
        in: path
        name: attachmentId
        required: true
        schema:
          type: string
      - description: Document the attachment belongs to
        in: path
        name: documentId
        required: true
        schema:
          type: string
      - description: API key identifying the calling company
        in: header
        name: X-API-KEY
        required: true
        schema:
          pattern: \S
          type: string
      - description: API secret for the calling company
        in: header
        name: X-API-SECRET
        required: true
        schema:
          pattern: \S
          type: string
      responses:
        '204':
          description: Attachment removed
        '400':
          description: Document is no longer editable, because it has already been sent for signing
        '401':
          description: Invalid or missing X-API-KEY / X-API-SECRET headers
        '404':
          description: No such document or attachment in this company and environment
      summary: Remove an attachment
      tags:
      - Public API – document signing
  /api/publics/v1/documents/{documentId}/signings:
    post:
      description: 'Sends an existing document to signers and returns their signing links.


        **The document must be in one of two statuses**.  Any other status results in a 400 error.


        **Status `GENERATED`** — signers must be provided:

        - `signers` list is required and must not be empty.

        - Provided signers are saved to the document and it is sent immediately.


        **Status `SIGNERS_ASSIGNED`** — signers must not be provided:

        - `signers` must be omitted or empty; signers already assigned to the document are used.

        - Providing any signers when the document is in this status returns 400.


        **Response signers:** only the first signer (by `order`) receives a `signUrl` and `expiresAt` immediately; remaining
        signers receive their link by email when their turn comes (link valid 48 h from sending).

        '
      parameters:
      - description: ID of the document to send for signing
        example: 03bef6df-faca-4aee-9836-80caeeaf4418
        in: path
        name: documentId
        required: true
        schema:
          type: string
      - description: API key identifying the calling company
        example: api_0XHLWp0eu5VRxdWJ_xcG-_zqUUZW640Xl07-KkOXhxw
        in: header
        name: X-API-KEY
        required: true
        schema:
          pattern: \S
          type: string
      - description: API secret for the calling company
        in: header
        name: X-API-SECRET
        required: true
        schema:
          pattern: \S
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendForSigningRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendForSigningResponse'
          description: Document sent for signing successfully
        '400':
          description: 'Invalid request. Possible reasons:

            - Document is not in GENERATED or SIGNERS_ASSIGNED status

            - Status GENERATED: `signers` is empty or missing

            - Status SIGNERS_ASSIGNED: `signers` provided (signers are already set in the document)

            - `signatureType` not provided

            - Bean-validation failure on signer fields (blank name/email, invalid country code, order < 1, etc.)

            '
        '401':
          description: Invalid or missing X-API-KEY / X-API-SECRET headers
        '403':
          description: Document does not belong to the company associated with the provided API key
      summary: Send existing document for signing
      tags:
      - Public API – document signing
  /api/publics/v1/documents/{documentId}/tags:
    put:
      description: 'Replaces the whole tag set of the document: tags left out of the request are removed from it, tags listed
        are added. Send an empty body to clear all tags. Tags can be given by `tagIds` (must already exist) or by `names`
        — a name that is not in the company tag list yet is added to it.

        '
      parameters:
      - description: Id of the document to tag
        in: path
        name: documentId
        required: true
        schema:
          type: string
      - description: API key identifying the calling company
        example: api_0XHLWp0eu5VRxdWJ_xcG-_zqUUZW640Xl07-KkOXhxw
        in: header
        name: X-API-KEY
        required: true
        schema:
          pattern: \S
          type: string
      - description: API secret for the calling company
        in: header
        name: X-API-SECRET
        required: true
        schema:
          pattern: \S
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetDocumentTagsRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TagResponse1'
                type: array
          description: Tags the document carries after the change
        '400':
          description: A name is longer than 15 characters, or a header is missing
        '401':
          description: Invalid API key or secret
        '403':
          description: Document does not belong to the caller's company/environment
        '404':
          description: One of the given tag ids does not exist in the caller's environment
      summary: Set document tags
      tags:
      - Public API – document signing
  /api/publics/v1/tags:
    get:
      description: 'Returns a paged list of tags belonging to the company identified by the API key. Tags are the labels shown
        on documents and templates; a document generated from a template inherits the template tags. Optionally narrow the
        list with `name` (case-insensitive fragment). Sort via the `sort` query param, e.g. `sort=name,asc`.

        '
      parameters:
      - description: Case-insensitive name fragment
        example: umow
        in: query
        name: name
        schema:
          type: string
      - in: query
        name: page
        schema:
          default: '0'
          format: int32
          type: integer
      - in: query
        name: size
        schema:
          default: '20'
          format: int32
          type: integer
      - in: query
        name: sort
        schema:
          items:
            type: string
          type: array
      - description: API key identifying the calling company
        example: api_0XHLWp0eu5VRxdWJ_xcG-_zqUUZW640Xl07-KkOXhxw
        in: header
        name: X-API-KEY
        required: true
        schema:
          pattern: \S
          type: string
      - description: API secret for the calling company
        in: header
        name: X-API-SECRET
        required: true
        schema:
          pattern: \S
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseTagResponseV1'
          description: Tag list returned successfully
        '400':
          description: X-API-KEY or X-API-SECRET header is missing or blank
        '401':
          description: Invalid API key or secret
      summary: List tags
      tags:
      - Public API – tags
    post:
      description: 'Adds a tag to the company tag list in the environment the API key belongs to. When a tag with the same
        name already exists (case-insensitive) that one is returned instead of a duplicate, so the call is safe to repeat.

        '
      parameters:
      - description: API key identifying the calling company
        example: api_0XHLWp0eu5VRxdWJ_xcG-_zqUUZW640Xl07-KkOXhxw
        in: header
        name: X-API-KEY
        required: true
        schema:
          pattern: \S
          type: string
      - description: API secret for the calling company
        in: header
        name: X-API-SECRET
        required: true
        schema:
          pattern: \S
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagResponse1'
          description: Tag added, or the already existing one returned
        '400':
          description: Name is blank, longer than 15 characters, or a header is missing
        '401':
          description: Invalid API key or secret
      summary: Add tag
      tags:
      - Public API – tags
  /api/publics/v1/tags/{tagId}:
    delete:
      description: 'Removes the tag from the company tag list and clears it from every document and template it was assigned
        to. Only tags of the environment the API key belongs to can be deleted.

        '
      parameters:
      - description: Id of the tag to delete
        in: path
        name: tagId
        required: true
        schema:
          type: string
      - description: API key identifying the calling company
        example: api_0XHLWp0eu5VRxdWJ_xcG-_zqUUZW640Xl07-KkOXhxw
        in: header
        name: X-API-KEY
        required: true
        schema:
          pattern: \S
          type: string
      - description: API secret for the calling company
        in: header
        name: X-API-SECRET
        required: true
        schema:
          pattern: \S
          type: string
      responses:
        '204':
          description: Tag deleted
        '400':
          description: X-API-KEY or X-API-SECRET header is missing or blank
        '401':
          description: Invalid API key or secret
        '404':
          description: No such tag in the caller's environment
      summary: Delete tag
      tags:
      - Public API – tags
security:
- bearerAuth: []
tags:
- description: Manually trigger background batch jobs (admin only).
  name: Admin schedulers
- description: Manage the trusted-timestamp (KIR TST) pool counter (admin only).
  name: Admin timestamp pool
- description: QES signing endpoints for AutoSignly desktop app
  name: DesktopSigning
- description: 'Attachments of a document. Every attachment is converted to PDF on upload and merged into the document (after
    an attachment index page, before the signature card) at the moment the document is sent to sign, so the electronic signature
    covers the attachments as well. Supported formats: PDF, JPEG, PNG — detected from the file content, not from the file
    name. Attachments can only be added, removed or reordered while the document has not been sent to sign yet.'
  name: Document attachments
- description: Order court-grade signature audit certificates sealed with QESeal; delivery is by email.
  name: Document signature certificates
- description: Preview signers and send document for signing. GET /preview returns document status; request body for POST
    /send is conditional on that status.
  name: Document signatures
- description: Add, edit and delete individual signers on a document in SIGNERS_ASSIGNED, WAITING_FOR_SIGNATURE, or SIGNING_IN_PROGRESS
    status.
  name: Document signers
- description: Lookup private (non-business) suppliers when filling supplier data on document forms.
  name: Document suppliers
- description: Create documents from template (generate/preview) or from uploaded PDF (upload). List, get, rename and delete
    documents.
  name: Documents
- description: Public test-only endpoints for frontend E2E suites.
  name: E2E local helpers
- description: Polymorphic folder tree shared by company documents (scope=COMPANY) and per-user documents (scope=USER).
  name: Folders
- name: Integrity Sign
- description: Operations related to notification rules for documents (global and per-document).
  name: Notifications
- description: Endpoints accessible via API key + secret (X-API-KEY and X-API-SECRET headers). No user login token required.
  name: Public API – document signing
- description: Company tag list, accessible via API key + secret (X-API-KEY and X-API-SECRET headers). The key decides the
    environment, so a sandbox key never sees production tags.
  name: Public API – tags
- description: Public AutoSignly configuration for the signing page.
  name: PublicAutosignly
- description: Public endpoints for viewing the signing page and signing documents by signer link.
  name: PublicSignature
- description: Public endpoint for validating electronic signatures on an uploaded PDF.
  name: PublicSignatureValidation
- description: WebAuthn signing endpoints for public (unauthenticated) signer links.
  name: PublicWebAuthn
- description: Authenticated sign page data (non-anonymized).
  name: Signature page
- description: Fetch which signature types and AES verification methods the user may choose in send-to-sign, add/edit signer
    forms, and related signing UI.
  name: Signature policy
- description: Per-user TEE/Secure Enclave public keys used to verify biometric signatures from the autodokumenty-mobile app.
    Mobile generates an EC P-256 keypair in the secure element, biometric-gated, and registers the public half here. The private
    key never leaves the device.
  name: Signing Device Keys
- description: Operations related to available system variables.
  name: System Variables
- description: Company-wide tag list. Tags are assigned to documents and templates (PUT /documents/{id}/tags, PUT /templates/{id}/tags)
    and can be used as list filters. Tags are stored in plaintext so they can be filtered on.
  name: Tags
- description: Per-user document copies. Use status=TO_SIGN for documents pending the user's signature, status=SIGNED for
    fully-signed documents.
  name: User Documents
- description: Initiate verification (SMS code or WK redirect) before signing.
  name: Verification
- description: Authentication via Węzeł Krajowy - login, session data, logout. All endpoints (except public callback) require
    companyId for company-scoped verification.
  name: Węzeł Krajowy (WK)
- description: Public callbacks from Węzeł Krajowy. No authentication required.
  name: Węzeł Krajowy (WK) - Public
