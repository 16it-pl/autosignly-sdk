  /api/publics/v1/tags:
    get:
      description: 'Returns a paged list of tags belonging to the company identified by the API key. Tags are the labels shown
        on documents and templates; a document generated from a template inherits the template tags. Optionally narrow the
        list with `name` (case-insensitive fragment). Sort via the `sort` query param, e.g. `sort=name,asc`.

        '
      parameters:
      - description: Case-insensitive name fragment
        example: umow
        in: query
        name: name
        schema:
          type: string
      - in: query
        name: page
        schema:
          default: '0'
          format: int32
          type: integer
      - in: query
        name: size
        schema:
          default: '20'
          format: int32
          type: integer
      - in: query
        name: sort
        schema:
          items:
            type: string
          type: array
      - description: API key identifying the calling company
        in: header
        name: X-API-KEY
        required: true
        schema:
          pattern: \S
          type: string
      - description: API secret for the calling company
        in: header
        name: X-API-SECRET
        required: true
        schema:
          pattern: \S
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseTagResponseV1'
          description: Tag list returned successfully
        '400':
          description: X-API-KEY or X-API-SECRET header is missing or blank
        '401':
          description: Invalid API key or secret
      summary: List tags
      tags:
      - Public API – tags
    post:
      description: 'Adds a tag to the company tag list in the environment the API key belongs to. When a tag with the same
        name already exists (case-insensitive) that one is returned instead of a duplicate, so the call is safe to repeat.

        '
      parameters:
      - description: 'Optional. Recommended format: UUID. Scoped to (companyId, envId). See `POST /documents/{documentId}/signings`
          for the full semantics (conflict cases, TTL).

          '
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        in: header
        name: Idempotency-Key
        schema:
          type: string
      - description: API key identifying the calling company
        in: header
        name: X-API-KEY
        required: true
        schema:
          pattern: \S
          type: string
      - description: API secret for the calling company
        in: header
        name: X-API-SECRET
        required: true
        schema:
          pattern: \S
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagResponse'
          description: Tag added, or the already existing one returned
        '400':
          description: 'Invalid request. Possible reasons:

            - Name is blank, longer than 15 characters, or a header is missing

            - Idempotency-Key does not match the expected format (1-255 chars, `[A-Za-z0-9._:-]`)

            '
        '401':
          description: Invalid API key or secret
        '409':
          description: Idempotency-Key reused with a different request body, or the original request is still being processed
        '503':
          description: Could not verify the Idempotency-Key due to a transient failure; safe to retry
      summary: Add tag
      tags:
      - Public API – tags
  /api/publics/v1/tags/{tagId}:
    delete:
      description: 'Removes the tag from the company tag list and clears it from every document and template it was assigned
        to. Only tags of the environment the API key belongs to can be deleted.

        '
      parameters:
      - description: Id of the tag to delete
        in: path
        name: tagId
        required: true
        schema:
          type: string
      - description: API key identifying the calling company
        in: header
        name: X-API-KEY
        required: true
        schema:
          pattern: \S
          type: string
      - description: API secret for the calling company
        in: header
        name: X-API-SECRET
        required: true
        schema:
          pattern: \S
          type: string
      responses:
        '204':
          description: Tag deleted
        '400':
          description: X-API-KEY or X-API-SECRET header is missing or blank
        '401':
          description: Invalid API key or secret
        '404':
          description: No such tag in the caller's environment
      summary: Delete tag
      tags:
      - Public API – tags
servers:
- description: Production and sandboxes
  url: https://app.autosignly.eu
tags:
- description: Endpoints accessible via API key + secret (X-API-KEY and X-API-SECRET headers). No user login token required.
  name: Public API – document signing
- description: Counterparties of the company, accessible via API key + secret (X-API-KEY and X-API-SECRET headers). The key
    decides the environment, so a sandbox key never sees production parties.
  name: Public API – parties
- description: Company tag list, accessible via API key + secret (X-API-KEY and X-API-SECRET headers). The key decides the
    environment, so a sandbox key never sees production tags.
  name: Public API – tags
