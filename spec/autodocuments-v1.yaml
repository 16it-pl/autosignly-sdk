        in: path
        name: partyId
        required: true
        schema:
          type: string
      - description: API key identifying the calling company
        in: header
        name: X-API-KEY
        required: true
        schema:
          pattern: \S
          type: string
      - description: API secret for the calling company
        in: header
        name: X-API-SECRET
        required: true
        schema:
          pattern: \S
          type: string
      responses:
        '204':
          description: Party deleted
        '400':
          description: X-API-KEY or X-API-SECRET header is missing or blank
        '401':
          description: Invalid API key or secret
        '404':
          description: No such party in the environment of this API key
      summary: Delete party
      tags:
      - Public API – parties
    get:
      description: Returns one party of the company, in the environment the API key belongs to.
      parameters:
      - description: Party identifier
        in: path
        name: partyId
        required: true
        schema:
          type: string
      - description: API key identifying the calling company
        in: header
        name: X-API-KEY
        required: true
        schema:
          pattern: \S
          type: string
      - description: API secret for the calling company
        in: header
        name: X-API-SECRET
        required: true
        schema:
          pattern: \S
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Party'
          description: Party returned successfully
        '400':
          description: X-API-KEY or X-API-SECRET header is missing or blank
        '401':
          description: Invalid API key or secret
        '404':
          description: No such party in the environment of this API key
      summary: Get party
      tags:
      - Public API – parties
    put:
      description: Replaces the party data. Every field is taken from the request, so send the complete party, not only what
        changed.
      parameters:
      - description: Party identifier
        in: path
        name: partyId
        required: true
        schema:
          type: string
      - description: API key identifying the calling company
        in: header
        name: X-API-KEY
        required: true
        schema:
